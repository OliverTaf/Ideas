"F": null, "G": null, "H": null}, {"r": 27, "cat": "Ondsindende mennesker", "thr": "Angreb med skadelig kode", "desc": "Den skadelige kode kan komme fra egne rækker eller udefra, hvis ikke systemerne er passende beskyttet. Det kan forurene, genere eller direkte kryptere data med krav om løsepenge til følge. God sikring og en verificeret backup er en god beskyttelse.", "A": null, "F": null, "G": null, "H": null}, {"r": 28, "cat": "Ondsindende mennesker", "thr": "Cyberterror angreb", "desc": "Typisk kryptering af data og systemer med afkrævning af løsepenge. Men også i militær sammenhæng benyttes det og det kan ramme med kryptering helt uden løsepengekrav, som vi så på et fakultet eller bare ødelægge udstyret.", "A": null, "F": null, "G": null, "H": null}, {"r": 29, "cat": "Ondsindende mennesker", "thr": "Informationstyveri", "desc": "Tyveri kan ske af mange årsager og af mange parter. Både eksterne kan tvinge sig ind og interne kan pga. afpresning, vrede eller egen økonomisk vinding stjæle både digitale som fysiske data.", "A": null, "F": null, "G": null, "H": null}, {"r": 30, "cat": "Ondsindende mennesker", "thr": "Forsætligt misbrug", "desc": "Særligt den vrede nuværende eller tidligere ansatte/associerede ses som aktører. Nogle gange også for personlig vindings skyld. Adgangen til data kan dog også misbruges ved dual-use viden og teknologier af militær, religiøs eller kulturel interesse.", "A": null, "F": null, "G": null, "H": null}, {"r": 31, "cat": "Ondsindende mennesker", "thr": "Bevidst afsløring af information", "desc": "Særligt den vrede nuværende eller tidligere ansatte/associerede ses som aktører. Nogle gange også for personlig vindings skyld. Eksterne kan finde på det ud fra en hacktivistisk vinkel eller for at øve afpresning specielt når det er følsomme persondata, der er berørt af hændelsen.", "A": null, "F": null, "G": null, "H": null}, {"r": 32, "cat": "Ondsindende mennesker", "thr": "Tyveri af aktiver", "desc": "Typisk sker tyveri af simple berigelsesårsager og det sker af eksterne aktører, der ikke har yderligere indsigt i hvad de stjæler. Unika eller følsomme data såsom persondata, politisk/religiøst eller af kulturelt udfordrende karakter er dog også potentielle mål og skal beskyttes derefter.", "A": null, "F": null, "G": null, "H": null}, {"r": 33, "cat": "Ondsindende mennesker", "thr": "Forsætlig destruktion", "desc": "Hacktivism eller skadelig statslig aktivitet kan ramme særligt digitale data. Cyberkrigsmodellen og den på gående grå krig mellem forskellige aktører viser at man nemt kan blive offer uden at være mål. Opdater, beskyt og sikr en fungerende backup af data. Fysiske data skal også kunne sikres mod en vred nuværende eller tidligere ansat/associeret.", "A": null, "F": null, "G": null, "H": null}, {"r": 34, "cat": null, "thr": "Fysisk skade", "desc": null, "A": null, "F": null, "G": null, "H": null}, {"r": 35, "cat": "Physical damage", "thr": "Brandskade", "desc": "Brand ødelægger alt og er den definitive destruktion. Det kan og skal forebygges ved korrekt indretning, sikring og varslingssystemer.", "A": null, "F": null, "G": null, "H": null}, {"r": 36, "cat": "Physical damage", "thr": "Vandskade", "desc": "Vandskade kan ødelægge meget. Det kan og skal forebygges ved korrekt indretning, sikring og varslingssystemer.", "A": null, "F": null, "G": null, "H": null}, {"r": 37, "cat": "Physical damage", "thr": "Elektromagnetisk beskadigelse", "desc": "Særligt elektronisk udstyr kan påvirkes af elektromagnetik. Det kan og skal forebygges ved korrekt indretning og sikring", "A": null, "F": null, "G": null, "H": null}, {"r": 38, "cat": "Physical damage", "thr": "Forurening af faciliteter", "desc": "Nogle data, særligt fysiske data, men også digitale kan tage skade ved forurening. Der bør derfor tages stilling til hvilke forureningsmuligheder, der skal undgås og sikres derefter.", "A": null, "F": null, "G": null, "H": null}, {"r": 39, "cat": null, "thr": "Naturkatatrofer", "desc": null, "A": null, "F": null, "G": null, "H": null}, {"r": 40, "cat": "Natural disaster", "thr": "Skade ved naturhændelse", "desc": "Jordskælv og vulkanudbrud hænder men er som trussel for data og databærende fysiske genstande på KU ikke så sandsynlig. Til gengæld er de lagre og repositories vi måtte have eller have part i i egne af verden, hvor den slags forekommer hyppigere, relevante at sikre.", "A": null, "F": null, "G": null, "H": null}, {"r": 41, "cat": null, "thr": "Tab af kritiske services", "desc": null, "A": null, "F": null, "G": null, "H": null}, {"r": 42, "cat": "Tab af kritiske services", "thr": "Skade ved katastrofal ulykke", "desc": "Brand og eksplosion men også skade på forsynings og it-systemer kan true sikring og bevarelse herunder en klar kommunikation til universitetets mange daglige brugere. Det skal indarbejdes som muligt scenarie beredskabsplaner", "A": null, "F": null, "G": null, "H": null}, {"r": 43, "cat": "Tab af kritiske services", "thr": "Fejl i fysisk miljøstyring", "desc": "Både for digitale som analoge/fysiske data skal det nøje overvejes og sikres hvordan man vil overvåge og reagere, hvis der er fejl i den fysiske miljøstyring som køl, frys, sug etc.", "A": null, "F": null, "G": null, "H": null}, {"r": 44, "cat": "Tab af kritiske services", "thr": "El-forsyningsfejl", "desc": "Spikes og brownouts samt almindelig forsyningssvigt hænder. Særligt data som er afhængige af konstant el_x0002_tilførsel bør sikres ved evt. at være på nødstrøm. Følsomt udstyr kan få en UPS eller en skinne med strømudsvingsjævning monteret. For fysiske data gælder det at genstande \nsom er afhængige af konstant eltilførsel bør sikres ved evt. at være på nødstrøm samt overvåges.", "A": null, "F": null, "G": null, "H": null}, {"r": 45, "cat": null, "thr": "Samfundstrusler", "desc": null, "A": null, "F": null, "G": null, "H": null}, {"r": 46, "cat": "Societal threats", "thr": "Kulturel trussel", "desc": "Dataene og de der har adgang til dem kan af kulturelle årsager blive truet både personl n kan blive søgt påvirket igennem økonomiske midler. Det bør sikres mod ved nøje at afveje mulige ubalancer eller overdreven mulighed for indflydelse fra én part i et samarbejde.", "A": null, "F": null, "G": null, "H": null}, {"r": 50, "cat": null, "thr": "Yderligere trusler relevante for enheden (maksimum 10 linjer)", "desc": null, "A": null, "F": null, "G": null, "H": null}, {"r": 51, "cat": "Additional threats", "thr": "Her kan enheden tilføje flere trusler", "desc": "Her skal truslen beskrives", "A": null, "F": null, "G": null, "H": null}, {"r": 52, "cat": "Additional threats", "thr": "Her kan enheden tilføje flere trusler", "desc": "Her skal truslen beskrives", "A": null, "F": null, "G": null, "H": null}, {"r": 53, "cat": "Additional threats", "thr": "Her kan enheden tilføje flere trusler", "desc": "Her skal truslen beskrives", "A": null, "F": null, "G": null, "H": null}, {"r": 54, "cat": "Additional threats", "thr": "Her kan enheden tilføje flere trusler", "desc": "Her skal truslen beskrives", "A": null, "F": null, "G": null, "H": null}, {"r": 55, "cat": "Additional threats", "thr": "Her kan enheden tilføje flere trusler", "desc": "Her skal truslen beskrives", "A": null, "F": null, "G": null, "H": null}, {"r": 56, "cat": "Additional threats", "thr": "Her kan enheden tilføje flere trusler", "desc": "Her skal truslen beskrives", "A": null, "F": null, "G": null, "H": null}, {"r": 57, "cat": "Additional threats", "thr": "Her kan enheden tilføje flere trusler", "desc": "Her skal truslen beskrives", "A": null, "F": null, "G": null, "H": null}], "comp": [{"r": 13, "header": "Management"}, {"r": 14, "q": "Medlemmerne i enhedens lokale informationssikkerhedsgruppe (LISG) er opdaterede på KU’s nyeste informationssikkerhedspolitikker.", "bg": "Genlæs \"Retningslinjer for informationssikkerhed på Københavns Universitet”.", "links": [["Informationssikkerhed - Retningslinjer.pdf (ku.dk)", "https://kunet.ku.dk/medarbejderguide/ITvejl/Informationssikkerhed%20-%20Retningslinjer.pdf"], ["Informationssikkerhed - KUnet", "https://kunet.ku.dk/medarbejderguide/Sider/Sikkerhed-og-beredskab/IS.aspx"]]}, {"r": 16, "q": "Enhedens lokale informationssikkerhedsgruppe (LISG) har afholdt mindst to møder det seneste år.", "bg": "I kommissoriet for LISG står det beskrevet, at gruppen skal mødes mindst to gange om året.", "links": [["Kommissorium for LISG SUND", "https://kunet.ku.dk/medarbejderguide/lokalinfo/Documents/Sider/Informationssikkerhed-p%C3%A5-SUND/Kommissorium%20LISG%20SUND%20270819.pdf"]]}, {"r": 17, "q": "Opretter alle forskningsledere i enheden en Data Management Plan for deres forskningsprojekt?", "bg": "Alle forskningsprojekter skal registrere en Data Management Plan.", "links": [["Forskningsdatamanagement og GDPR - KUnet", "https://kunet.ku.dk/arbejdsomraader/forskning/data/Sider/default.aspx"]]}, {"r": 18, "q": "Opdateres Data Management Planerne, når der sker væsentlige ændringer i håndteringen af forskningsdata?", "bg": "KU's Politik for Forskningsdatamanagement er relevant at kende for alle, der udfører eller understøtter forskningsaktiviteter på KU.", "links": [["KU's Politik for Forskningsdatamangement", "https://kunet.ku.dk/work-areas/research/data/Documents/KUPolitikforForskningsdatamanagement2022-DA.pdf"]]}, {"r": 19, "header": "Nye brugere (ansatte, studerende og eksterne)"}, {"r": 20, "q": "Enheden har en nedskrevet procedure for, hvordan informationssikkerhedspolitikker og instruktioner introduceres for alle nye medarbejdere, studerende og eksterne.", "bg": "Alle nye medarbejdere, studerende og eksterne skal introduceres til enhedens informationssikkerhedspolitikker, når de skal have adgang til enhedens data og aktiver.", "links": []}, {"r": 21, "q": "Udarbejdes og journaliseres databehandleraftaler med eksterne i Workzone, hvis de får adgang til personfølsomme data?", "bg": "Hvis persondata overlades til eksterne, som skal udføre en opgave for universitetet, skal der indgås en databehandleraftale.\nFind skabelonen ”Skabelon til gæsteaftale med databehandleraftale”.", "links": [["Brug af eksterne databehandlere - KUnet.", "https://kunet.ku.dk/medarbejderguide/Sider/Sikkerhed-og-beredskab/Databehandlere.aspx"]]}, {"r": 22, "q": "Er enhedens forskningsgruppeledere bekendt med SUNDs GDPR-guide og GDPR-siden på Kunet?", "bg": "I SUNDs GDPR-vejledning findes der information om GDPR i forskningsprojekter.", "links": [["SUNDs GDPR Guidelines.pdf (ku.dk)", "https://kunet.ku.dk/fakultet-og-institut/sund/personale/husjura/Documents/GDPR%20Guidelines.pdf"], ["GDPR-guides - KUnet", "https://kunet.ku.dk/medarbejderguide/Sider/Sikkerhed-og-beredskab/GDPR-guide.aspx"]]}, {"r": 24, "q": "Er enheden bekendt med KU's nye politik for forskningsdatamanagement fra 2022?", "bg": "En ny universitetspolitik for forskningsdatamanagement blev godkendt af rektor den 11. januar 2022. Den erstatter den hidtidige KU-politik for forskningsdata fra 2014.", "links": [["KU Politik for Forskningsdatamanagement 2022", "https://kunet.ku.dk/work-areas/research/data/Documents/KUPolitikforForskningsdatamanagement2022-DA.pdf"]]}, {"r": 25, "q": "Enheden opfordrer alle medarbejdere, der arbejder med persondata, til at gennemføre KU’s obligatoriske GDPR-kursus.", "bg": "Alle ansatte, der arbejder med persondata, skal gennemføre KU’s online kursus i GDPR.", "links": [["Online GDPR-kursus - KUnet", "https://kunet.ku.dk/medarbejderguide/Sider/Sikkerhed-og-beredskab/GDPR-kursus.aspx?searchHitHighlight=gdpr%20kursus"]]}, {"r": 26, "q": "Enheden følger op på om alle medarbejdere, der arbejder med persondata, gennemfører KU’s obligatoriske GDPR-kursus.\n\nAngiv procentdelen for personer i enheden, der har gennemført GDPR-kurset, i kommentarfeltet.", "bg": "Alle ansatte, der arbejder med persondata, skal gennemføre KU’s online kursus i GDPR.", "links": [["Alle tal vedrørende gennemførslen af GDPR-kurset kan findes i Tableau.", null]]}, {"r": 27, "q": "Enheden opfordrer alle medarbejdere til at gennemføre KU’s IT-sikkerhedskursus.\n\nAngiv procentdelen for personer i enheden, der har gennemført IT-sikkerhedskurset, i kommentarfeltet.", "bg": "Alle ansatte opfordres til at styrke deres viden om IT-sikkerhed ved at gennemføre KU’s IT-sikkerhedskursus", "links": [["IT-sikkerhedstræning - KUnet", "https://kunet.ku.dk/medarbejderguide/Sider/It/IT-sikkerhedstraening.aspx"]]}, {"r": 28, "header": "Adgang til informationer (data og effekter)"}, {"r": 29, "q": "Enheden har en nedskrevet procedure for hvem der kan tildele adgang til klassificerede data, effekter og systemer.", "bg": "Det skal sikres, at dataejere har viden om, hvem der tildeles adgang til klassificeret materiale. \n\nEnheden er opmærksom på funktionsadskillelse ved tildeling af rettigheder og adgang til systemer.", "links": []}, {"r": 30, "q": "Enheden har en nedskrevet procedure for at fjerne adgang til klassificerede data, effekter og systemer.", "bg": "Det skal sikres, at adgange fjernes, når de ikke længere er berettiget i forhold aktuelle opgaver.", "links": []}, {"r": 31, "q": "Enheden gennemgår tildelte rettigheder til data på S-drev halvårligt.", "bg": "Det skal sikres, at medarbejdere, studerende og eksternes adgange fjernes, når arbejdsopgaven ikke længere berettiger adgang.", "links": []}, {"r": 32, "q": "Enheden sikrer, at fortrolige og personfølsomme data altid opbevares på krypterede enheder, når de ikke gemmes på S-drev eller i beskyttede fagsystemer.", "bg": "Adgang til klassificerede data skal altid beskyttes mod uvedkommende (også under \"transport\").", "links": [["Opbevaring af persondata - KUnet", "https://kunet.ku.dk/medarbejderguide/Sider/Sikkerhed-og-beredskab/Opbevaring-af-persondata.aspx"]]}, {"r": 33, "q": "Enheden følger KU’s sikkerhedsvejledning for mobile enheder (laptops, mobiltelefoner, usb medier etc).", "bg": null, "links": [["Sikkerhedsvejledning - mobile enheder.pdf (ku.dk)", "https://kunet.ku.dk/medarbejderguide/ITvejl/Sikkerhedsvejledning%20-%20mobile%20enheder.pdf"]]}, {"r": 34, "q": "Enheden følger KU’s sikkerhedsvejledning for fjernarbejde.", "bg": null, "links": [["Sikkerhedsvejledning - fjernarbejde.pdf (ku.dk)", "https://kunet.ku.dk/medarbejderguide/ITvejl/Sikkerhedsvejledning%20-%20fjernarbejde.pdf"]]}, {"r": 35, "header": "Opbevaring af data"}, {"r": 36, "q": "Enheden instruerer medarbejdere, studerende og eksterne om, hvordan data skal opbevares korrekt på KU og hvordan data deles med eksterne.", "bg": "Der tages kun backup af KU’s netværksdrev (ikke lokale drev på computere), og gælder specielle retningslinjer for personfølsomme data.", "links": [["Opbevaring og deling af data - KUnet", "https://kunet.ku.dk/medarbejderguide/Sider/It/Behandling-af-data.aspx"]]}, {"r": 37, "q": "Enheden er bekendt med KU’s retningslinjer for brugen af cloudtjenester.", "bg": null, "links": [["Opbevaring og deling af data - KUnet", "https://kunet.ku.dk/medarbejderguide/Sider/It/Behandling-af-data.aspx"]]}, {"r": 38, "q": "Enheden er opmærksom på, at \ne-mails indeholdende fortrolige og personfølsomme data maksimalt må opbevares i Outlook i 30 dage.", "bg": "Fortrolige og følsomme data må ikke opbevares i Outlook i mere end 30 dage. Herefter skal e-mails med fortrolige eller følsomme data journaliseres i Workzone eller kopieres til et personligt netværksdrev eller til et S-drev. Det skyldes, at Outlook ikke har et passende sikkerhedsniveau til opbevaring af følsomme og fortrolige persondata, da KU-mailkonti ofte udsættes for phishing-angreb mv.", "links": [["Opbevaring af persondata - Kunet", "https://kunet.ku.dk/medarbejderguide/Sider/Sikkerhed-og-beredskab/Opbevaring-af-persondata.aspx"]]}, {"r": 39, "q": "Enheden er bevidst om nødvendigheden af backup af data på lokale it-servere, der ikke håndteres af KU-IT.", "bg": "Det skal sikre, at værdifulde data opbevaret på lokale servere, pc'ere, instrumenter eller i lokale systemer ikke går tabt.", "links": []}, {"r": 40, "header": "Ophør af brugere (ansatte, studerende og eksterne)"}, {"r": 41, "q": "Enheden har en skriftlig procedure for at sikre, at medarbejdere, studerende og eksterne returnerer data og effekter tilhørende enheden eller KU ved ophør.", "bg": "Det skal sikres, at data og andre aktiver placeres/gemmes, så de er tilgængelige for enheden fremadrettet. \n\nDet skal også sikres, at brugeren ikke har en kopi af fortrolige og personfølsomme data.", "links": []}, {"r": 42, "header": "Returnering af informationer (papier, it-udstyr, it-medier)"}, {"r": 43, "q": "Enheden har en procedure for at tilbageleverede, brugte medier og papirer indeholdende fortrolige eller personfølsomme oplysninger sikkert destrueres eller makuleres.", "bg": "Det skal sikres at informationer fra medier og papirer ikke kan genskabes af uvedkommende.", "links": []}, {"r": 44, "q": "Enheden returnerer brugte devices (computere, harddiske, usb medier, etc.) til det lokale KU-IT supportcenter til genbrug eller sikker destruktion.", "bg": null, "links": [["Genbrug af IT - KUnet", "https://kunet.ku.dk/medarbejderguide/Sider/It/Genbrug-af-IT.aspx"]]}, {"r": 45, "header": "Fysisk sikkerhed"}, {"r": 46, "q": "Enheden har gennemgået behovet for sikring af lokaler og adgang til steder, hvor der opbevares klassificerede informationer.", "bg": "Lokaler, samlinger og udstyr, der indeholder fortrolige, klassificerede og personfølsomme data er tilstrækkeligt beskyttet mod tyveri eller tilfældig eksponering for uvedkommende (fx ved låste lokaler eller opbevaring i aflåste skabe).", "links": []}, {"r": 47, "q": "Enheden har gennemgået placeringen udstyr, samlinger og dokumenter med klassificerede informationer for at sikre, at dette er tilstrækkeligt beskyttet mod vandskade og brand.", "bg": "Lokaler, samlinger og udstyr, der indeholder informationer skal være tilstrækkeligt beskyttet mod fysisk tilintetgørelse.", "links": []}, {"r": 48, "q": "Enheden gennemgået om der er dataopsamlingsudstyr eller andre instrumenter, der skal beskyttes mod strømsvigt.", "bg": "Udstyr, hvor det er vitalt, at det ikke afbrydes af et strømsvigt, kan eventuelt beskyttes med en lille lokal nødstrømsforsyning.", "links": []}, {"r": 49, "q": "Enheden har gennemgået om der er tilstrækkelig overvågning af køleskabe og frysere, o.lign?", "bg": "Opbevaring af fysisk materiale, skal sikres mod ødelæggelse gennem tilsyn eller overvågning med alarmering.", "links": []}, {"r": 50, "header": "Informationssikkerhedbrud"}, {"r": 51, "q": "Enheden er bevidst om, at brud på informationssikkerheden, hvor personfølsomme data eksponeres for uvedkommende, omgående skal meldes til KU’s DPO.", "bg": "KU’s DPO skal omgående inddrages for at vurderer om hændelsen skal indrapporteres til Datatilsynet. Vurderer DPO’en, at hændelsen skal indrapporteres, skal det ske inden 72 timer efter informationssikkerhedes hændelsen.", "links": [["Håndtering af sikkerhedshændelser - KUnet", "https://kunet.ku.dk/medarbejderguide/Sider/Sikkerhed-og-beredskab/Sikkerhedshaendelser.aspx"]]}, {"r": 52, "header": "Enhedens hardware og software"}, {"r": 53, "q": "Enheden fører en fortegnelse over hardware (servere og desktops), der ikke er leveret af KU-IT og som har adgang til netværk, der indeholder systemer og data, som er vigtige for forskningen.", "bg": "Dette bliver en opgave på sigt. Afklaring med KU-IT udestår.", "links": []}, {"r": 54, "q": "Enheden har et overblik over anvendt software på pc’er, der ikke er leveret af KU-IT, og om den anvendte software er opdateres.", "bg": "Dette bliver en opgave på sigt. Afklaring med KU-IT udestår.", "links": []}, {"r": 55, "q": "Enheden har et overblik over anvendt software på servere, der ikke er leveret af KU-IT, og om den anvendte software er opdateres.", "bg": "Dette bliver en opgave på sigt. Afklaring med KU-IT udestår.", "links": []}, {"r": 56, "header": "Awareness kampagner"}, {"r": 57, "q": "Enheden har udvalgt et emne for en awareness kampagne henvendt til medarbejdere og studerende.\nAngiv i kommentarfeltet, hvilken aktivitet der planlægges at blive gennemført.", "bg": "Enheden opfordres til at udvælge et eller flere områder, hvor der kan gennemføres en awareness kampagne for at styrke bevidstheden om informationssikkerheden i enheden.", "links": []}], "guide": [{"t": "Indholdsfortegnelse", "b": "0. Vejledning\n1. Overordnet information og tjekliste\n2. Datatyper\n3. Dataklassifikation\n4. Trusler og sårbarheder\n5. Risikovurdering\n6. Compliance tjekliste\n7. Risikohåndtering\n8. Feedbackfane\n\nDenne informationssikkerhedsplanskabelon bygger på Københavns Universitets politikker og retningslinjer for informationssikkerhed.\n\nSpørgsmål vedr. skabelonen kan henvendes til:\ninformationssikkerhed@sund.ku.dk"}, {"t": "0. Vejledning", "b": "I kan med fordel printe denne fane ('0. Vejledning'), så I kan orientere jer i denne vejledning undervejs, mens I udfylder fanerne i informationssikkerhedsplanen.\n\nDa nogle af fanerne er sat op til automatisk at overføre svar fra én fane til en anden, anbefales det kraftigt at fanerne er udfyldes i rækkefølgen 2 til 8.  \n\nI denne vejledning finder du baggrundsinformationen for de oplysninger, I bliver bedt om at give i hver fane. I de enkelte faner finder I en vejledning, der leder jer igennem processen med at udfylde tabellerne i hver fane.\n\nFaner:\n0. Vejledning\n1. Overordnet information og tjekliste\n2a. Datatyper - digitale\n2b. Datatyper - fysiske\n3a. Dataklassifikation - digitale\n3b. Dataklassifikation - fysiske\n4a. Trusler og sårbarheder - digitale\n4b. Trusler og sårbarheder - fysiske\n5a. Risikovurdering - digitale\n5b. Risikovurdering - fysiske \n6. Compliance tjekliste\n7. Risikohåndtering\n8. Feedback"}, {"t": "1. Overordnet information og tjekliste", "b": "Denne fane giver et overblik over indholdet i informationssikkerhedsplanen.\n\nUdfyld først informationerne om medlemmerne af enhedens lokale informationssikkerhedsgruppe (LISG). Som beskrevet i kommissoriet for LISG SUND består gruppen af institut- eller centerlederen (IL), institutadministratoren (IA) samt relevante medarbejdere, der tilsammen dækker digitale og fysiske informationer inden for forskning, uddannelse og administration.\n\nFor at skabe et overblik over, at alt i informationssikkerhedsplanen er udfyldt, skal den overordnede tjekliste udfyldes. Det anbefales at tjeklisten udfyldes efter fanerne 2-8 er udfyldt."}, {"t": "2. Datatyper", "b": "Første skridt mod at kunne lave en riskovurdering er at definere, hvilke datatyper enheden har. I disse to faner '2a. Datatyper - digitale' og '2b. Datatyper - fysiske'  er de overordnede kategorier for digitale og fysiske datatyper på SUND anført.\n\nGennemgå de anførte datatyper og vurdér om datatypen er relevant for enheden. I højre kolonne bedes I uddybe jeres svar.\n\nDe datatyper, som I vælger, vil automatisk blive overført til de næste to faner: '3a. Dataklassifikation - digital' og '3b. Dataklassifikation - fysisk'."}, {"t": "3. Dataklassifikation", "b": "Alle de datatyper, som I netop har valgt på de forrige faner, er automatisk overført og vises på disse faner: '3a. Dataklassifikation - digitale' og '3b. Dataklassifikation - fysiske'.  \n\nFor hver datatyper skal I nu klassificere datatypen på en score fra 1-4 ud fra KU's dataklassifikationssystem for Fortrolighed, Integritet, Tilgængelighed. Definitionerne på disse tre kategorier findes over tabellen i fanen. \n\nNår klassifikationen af datatypen er udfyldt, vil der komme et tal til syne i kolonnen ' Konsekvens'. Tallet i konsekvenskolonnen afgøres af, hvilken klassifikation I har givet de enkelte datatyper i kolonnerne 'Fortrolighed', 'Integritet', 'Tilgængelighed'.\n\nHvis man sætter et 'X' i F1, I1 eller T1 - tolkes konsekvensen som 4. \nHvis man sætter et 'X' i F2, I2 eller T2 - tolkes konsekvensen som 3.\nHvis man sætter et 'X' i F3, I3 eller T3 - tolkes konsekvensen som 2. \nHvis man sætter et 'X' i F4, I4 eller T4 - tolkes konsekvensen som 1. \n\nTallene i konsekvenskolonnen vil automatisk blive overført til de næste to faner '5a Risikovurdering - digitale' og '5b Risikovurdering - fysiske'"}, {"t": "4. Trusler og sårbarheder", "b": "På denne fane finder I truslerne fra KU's Trusselskatalog. \n\nFørst skal I vælge, hvorvidt I finder truslen relevant eller ej for jeres enhed.  \n\nDernæst skal I udfylde den 'Generelle sandsynlighed' ved at afgøre i hvilken grad I finder det sandsynligt, at truslen kan finde sted generelt set: Er det usandsynligt at truslen vil finde sted, er det lidt sandsynligt, meget sandsynligt eller vil truslen uden tvivl forekomme?\n\nHerefter skal I beskrive, hvordan I har taget hånd om sårbarhederne, der er tilstede i relation til truslen. Fx: Har I implementeret en god onboarding proces, der er med til at mindske brugerfejl? Har I en passende fysisk adgangskontrol for udvalgte områder, der sikre at det er autoriseret personale, der har adgang til områderne, osv.? \n\nBaseret på sandsynligheden for at truslen finder sted og de beskrevne mitigerende tiltag, hvad vurderer I sandsynligheden til at være for at truslen finder sted og resulterer i at data i enheden bliver kompromitteret? \n\nDette er jeres sandsynlighed for truslen. \n\nVurderingen af sandsynligheden vil automatisk blive overført til de to faner '5a. Risikovurdering - digital' og '5b. Risikovurdering - fysisk'."}, {"t": "5. Risikovurdering", "b": "Her finder I en oversigt over enhedens risici. \n\nInformation fra de forrige faner er automatisk overført til disse faner ('5a. Risikovurdering - digital' og '5b. Risikovurdering - fysisk') og konsekvensen ved tab eller læk af data holdes op imod sandsynligheden for at udvalgte trusler finder sted. Disse er alle givet farverne rød, gul eller grøn. \n\nNogle af truslerne er ikke nødvendigvis relevante for alle de valgte datatyper, som de er parret med, og I har her derfor mulighed for at skrive 'NA' (Not applicable'), hvis I vurderer at matchet ikke er relevant."}, {"t": "6. Compliance tjekliste", "b": "I denne fane er der samlet en række spørgsmål og udsagn, som skal hjælpe instituttet og centret på vej mod at forbedre informationssikkerheden. \n\nVed at gennemgå listen kan enheden få et overblik over, hvilke krav, retningslinjer og tiltag, der allerede opfyldes og et overblik over, hvor der er forbedringspotentiale. \n\nTil hvert tjeklistepunkt er der samlet baggrundsinformation og om muligt et link for en nærmere beskrivelse af tjeklistepunket."}, {"t": "7. Risikohåndtering", "b": "I har nu fundet frem til jeres risici, både i de to risikovurderinger og i compliance tjeklisten, og I skal nu afgøre, hvordan I vil håndtere jeres risici. \n\nI risikovurderingerne ('5a. Risikovurdering - digital' og '5b. Risikovurdering - fysisk'), blev datatyperne sammenholdt med de tilstedeværende trusler og heraf givet farven rød, gul eller grøn. I skal nu forholde jer til, hvordan I vil håndtere de risici, som har fået farven gul eller rød. \n\nOpskriv de røde og gule risici, som I vil arbejde på, I hver deres kolonne. \nOpskriv derefter de 'nej'-svar, som I har fra compliance tjeklisten. \n\nDernæst skal I afgøre, hvordan I vil håndtere udvalgte risici. Jeres håndteringsmuligheder er beskrevet i fanen."}, {"t": "8. Feedback fane", "b": "For at gøre informationssikkerhedsplanskabelonen til et endnu bedre redskab for SUNDs institutter og centre, må I meget gerne give feedback på skabelonen og dele jeres oplevelse af arbejdet med informationssikkerhed generelt. \n\nDernæst er der kun tilbage at klikke ind på fanen '1. Overordnet information og tjekliste' og krydse af, at alle emner er udfyldt."}], "info": {"hdr": "Informationssikkerhedsplan", "chk": ["Enheden har angivet navne, jobtitler og e-mailadresser på medlemmerne af den lokale informationssikkerhedsgruppe (LISG). \n(Fane 1.)", "Enheden har udvalgt og beskrevet, hvilke digitale datatyper den har.\n(Fane 2a.)", "Enheden har udvalgt og beskrevet, hvilke fysiske datatyper den har.\n(Fane 2b.)", "Enheden har udfyldt dataklassifikationen for den digitale data.\n(Fane 3a.)", "Enheden har udfyldt dataklassifikationen for den fysiske data.\n(Fane 3b.)", "Enheden har udvalgt, hvilke trusler den har i relation til digital data. \n(Fane 4a.)", "Enheden har udvalgt, hvilke trusler den har i relation til fysisk data. \n(Fane 4b.)", "Enheden har lavet en risikovurdering for digitale data.\n(Fane 5a.)", "Enheden har lavet en risikovurdering for fysiske data. \n(Fane 5b.)", "Enheden har udfyldt compliance tjeklisten.\n(Fane 6.)", "Enheden har taget stilling til håndteringen af enhedens risici.\n(Fane 7.)", "Enheden har udfyldt feedback fanen.\n(Fane 8.)", "Institut- eller centerlederen har læst og godkendt denne informationssikkerhedsplan."], "steps": ["Indsæt navn på institut eller center", "Angiv navnene på medlemmerne af enhedens Lokale Informationssikkerhedsgruppe (LISG)", "Besvar den overordnede tjekliste efterhånden som I udfylder fanerne."], "notes": ["Vær opmærksom på at institutlederen eller centerlederen er formand for enhendens Lokale Informationssikkerhedsgruppe (LISG).", "Både forskningsledere, administrative ledere og uddannelse bør være repræsenteret i den lokale informationssikkerhedsgruppe."]}, "lists": {"dig": ["Data fra eksterne registre/databaser", "Ekstern data (med kontraktlige forpligtelser)", "Generel administration", "HR data", "Intern data (rå eller behandlet)", "Offentlig data", "Patientdata", "Publiceret data", "Økonomisk data", "Andet"], "fys": ["Ekstern data (med kontraktlige forpligtelser)", "Generel administration", "HR data", "Intern data (rå eller behandlet)", "Offentlig data", "Patient data", "Prøver - menneske", "Prøver eller objekter - dyr", "Prøver eller objekter - genstand", "Prøver eller objekter - plante", "Publiceret data", "Økonomisk data", "Andet"], "gdpr": ["GDPR eller fortroligt", "Hverken GDPR eller fortroligt", "Open access", "Ikke open access"], "act": ["Accepter", "Reducer", "Undgå", "Del/overfør"], "vt": ["VIP", "TAP"]}, "tips": {"2a": {"steps": ["Afgør om den listede datatype er relevant for enheden. Vælg ja eller nej (i kolonne 'C').", "Beskriv hvor data opbevares (kolonne 'I').", "Beskriv kort hvilke data enheden har (kolonne 'J').", "Hvis en af de listede datatyper ikke er relevant for enheden, bedes I beskrive hvorfor (kolonne 'K').", "Tilføj eventuelle andre relevante datatyper for enheden i bunden af listen."], "notes": ["- Data, der indeholder personfølsomme data eller fortrolige informationer, bør kun gemmes på KU's S-drev eller i systemer, der beskytter data.", "- Andre data skal gemmes på KU netværksdrev.", "- Lokale drev bør kun benyttes til korttidsopbevaring.", "- Cloudtjenester bør kun bruges til opbevaring af data, der ikke indeholder personfølsomme eller fortrolige informationer, alternativt skal data krypteres."]}, "2b": {"steps": ["Afgør om den listede datatype er relevant for enheden. Vælg ja eller nej (i kolonne 'C').", "Beskriv hvor data opbevares (kolonne 'I').", "Beskriv kort hvilke data enheden har (kolonne 'J').", "Hvis en af de listede datatyper ikke er relevant for enheden, bedes I beskrive hvorfor (kolonne 'K').", "Tilføj eventuelle andre relevante datatyper for enheden i bunden af listen."], "notes": ["Om der er specielle krav til opbevaringen, fx fryser -18 grader, fryser - 80 grader, fugtighed, o.lign."]}, "3a": {"steps": ["Trin 1 Vurder 'Fortrolighed'", "Trin  2 Vurder 'Integritet'", "Trin 3 Vurder 'Tilgængelighed", "Trin 4 Forklar den valgte klassifikation"], "defs": [["Fortrolighed", "Fortrolighed betyder, hvor store konsekvenser det har, at informationerne kommer til uvedkommendes kendskab. Det afhænger både af lovgivning og KU's egen risikoappetit, som er afspejlet i KU’s risikoprofil."], ["F1", "Informationssamlinger og systemer der indeholder personfølsomme eller personhenførbare informationer (GDPR)"], ["F2", "Informationssamlinger og systemer der indeholder informationer der medfører imagetab ved eksponering"], ["F3", "Informationssamlinger og systemer der indeholder informationer der medfører brud på kontraktuelle forpligtelser ved eksponering"], ["F4", "Informationssamlinger og systemer der indeholder frit tilgængelige data eller data hvis eksponering ikke har mærkbar konsekvens"], ["Integritet", "Integritet betyder, hvilken konsekvens det har, hvis man ikke kan stole på informationernes tilstand. \nDet kan for eksempel medføre, at man ikke kan eftervise forskningsresultater, hvis forskningsdata ændres efter publikation. Eller at værdien af en grad fra KU falder, hvis ikke man kan stole på karakterer og kursusdeltagelse:"], ["I1", "Informationssamlinger og systemer der indeholder informationer hvor mgl. integritet medfører konsekvens for image og evnen til at opretholde forskningen"], ["I2", "Informationssamlinger og systemer der indeholder informationer hvor manglende integritet medfører brud på kontraktuelle forpligtigelser"], ["I3", "Informationssamlinger og systemer der indeholder informationer hvor manglende integritet medfører en økonomisk byrde i forbindelse med retablering"], ["I4", "Informationssamlinger og systemer der indeholder informationer hvis integritet ikke har mærkbar konsekvens"], ["Tilgængelighed", "Tilgængelighed betyder, at informationer er tilgængelige, når der er behov for dem. \nTilgængelighedskravet afspejler derfor både konsekvensen, hvis data går tabt og hvor lang tid man kan klare sig uden adgang til dem:"], ["T1", "Utilgængelighed på <=2 timer kan accepteres. Katastrofegrænse ved nedbrud er 1 døgn"], ["T2", "Utilgængelighed på <=1 døgn kan accepteres. Katastrofegrænse ved nedbrud er 3 døgn"], ["T3", "Utilgængelighed på <=1 uge kan accepteres. Katastrofegrænse ved nedbrud er 3 uge"], ["T4", "Utilgængelighed på >1 uge kan accepteres. Katastrofegrænse ved nedbrud er >3 uger"]]}, "3b": {"steps": ["Trin 1 Vurder 'Fortrolighed'", "Trin  2 Vurder 'Integritet'", "Trin 3 Vurder 'Tilgængelighed'", "Trin 4 Forklar den valgte klassifikation"], "defs": [["Fortrolighed", "Fortrolighed betyder, hvor store konsekvenser det har, at informationerne kommer til uvedkommendes kendskab. Det afhænger både af lovgivning og KU's egen risikoappetit, som er afspejlet i KU’s risikoprofil."], ["F1", "Informationssamlinger og systemer der indeholder personfølsomme eller personhenførbare informationer (GDPR)"], ["F2", "Informationssamlinger og systemer der indeholder informationer der medfører imagetab ved eksponering"], ["F3", "Informationssamlinger og systemer der indeholder informationer der medfører brud på kontraktuelle forpligtelser ved eksponering"], ["F4", "Informationssamlinger og systemer der indeholder frit tilgængelige data eller data hvis eksponering ikke har mærkbar konsekvens"], ["Integritet", "Integritet betyder, hvilken konsekvens det har, hvis man ikke kan stole på informationernes tilstand. \nDet kan for eksempel medføre, at man ikke kan eftervise forskningsresultater, hvis forskningsdata ændres efter publikation. Eller at værdien af en grad fra KU falder, hvis ikke man kan stole på karakterer og kursusdeltagelse:"], ["I1", "Informationssamlinger og systemer der indeholder informationer hvor mgl. integritet medfører konsekvens for image og evnen til at opretholde forskningen"], ["I2", "Informationssamlinger og systemer der indeholder informationer hvor manglende integritet medfører brud på kontraktuelle forpligtigelser"], ["I3", "Informationssamlinger og systemer der indeholder informationer hvor manglende integritet medfører en økonomisk byrde i forbindelse med retablering"], ["I4", "Informationssamlinger og systemer der indeholder informationer hvis integritet ikke har mærkbar konsekvens"], ["Tilgængelighed", "Tilgængelighed betyder, at informationer er tilgængelige, når der er behov for dem. \nTilgængelighedskravet afspejler derfor både konsekvensen, hvis data går tabt og hvor lang tid man kan klare sig uden adgang til dem:"], ["T1", "Utilgængelighed på <=2 timer kan accepteres. Katastrofegrænse ved nedbrud er 1 døgn"], ["T2", "Utilgængelighed på <=1 døgn kan accepteres. Katastrofegrænse ved nedbrud er 3 døgn"], ["T3", "Utilgængelighed på <=1 uge kan accepteres. Katastrofegrænse ved nedbr d hændelsen\n- Kendt fra offentlige og private virksomheder"], ["Meget sandsynligt", "Det er sandsynligt at hændelsen vil finde sted\n- Erfaring med hændelsen, men ikke inden for de sidste 12 måneder\n- Kendt fra offentlige og private virksomheder (nævnt årligt i pressen)"], ["Vil finde sted", "Hændelsen forventes at finde sted\n- Erfaring med hændelsen inden for de sidste 12 måneder\n- Hændelsen finder regelmæssigt sted i andre private og offentlige virksomheder (ofte nævnt i pressen)"]]}, "5a": {"steps": ["Trin 1          For hver datatype kigges efter om trusselsscenariet kan forekomme for datatypen", "Trin 2          Hvis scenariet ikke er relevant, overskrives talværdien i den røde, gule eller grønne celle med NA (not applicable)."], "notes": ["Farver: 1-5 grøn, 6 gul, 7-20 rød. Klik på en celle for at markere den som NA (ikke relevant)."]}, "5b": {"steps": ["Trin 1          For hver datatype kigges efter om trusselsscenariet kan forekomme for datatypen", "Trin 2          Hvis scenariet ikke er relevant, overskrives talværdien i den røde, gule eller grønne celle med NA (not applicable)."], "notes": ["Farver: 1-5 grøn, 6 gul, 7-20 rød. Klik på en celle for at markere den som NA (ikke relevant)."]}, "6": {"steps": ["Besvar tjekspørgsmålet", "Skriv eventuelt en kommentar", "Hvis ikke relevant, beskriv hvorfor"]}, "7": {"steps": ["List alle 'røde' resultater fra både den digital og fysisk risikovurdering.", "List alle 'gule' resultater fra både den digital og fysisk risikovurdering.", "List alle 'nej'-svar fra compliance tjeklisten.", "Vælg en måde at håndtere risikoen på i henhold til nedestående beskrivelser af håndteringsmuligheder.", "Udvælg 2-3 emner i hver sektion, som er en prioritet for enheden. Sæt et 'X' ud for de udvalgte emner.", "Beskriv en handlingsplan for de prioriterede emner (kolonne 'D', 'E', 'F' og 'G')."], "defs": [["Accepter", "Accepterede risici bør genbesøges regelmæssigt, da trusler og konsekvenser kan have ændret sig siden risikoaccepten,  else if(d.act==='reset'){if(confirm('Slet alle indtastede data?')){S=fresh();save();render()}}
 else if(d.act==='io'){$('#dtx').value=JSON.stringify(S);$('#dlg').showModal()}});
$('#dclose').onclick=()=>$('#dlg').close();
$('#dcopy').onclick=()=>{$('#dtx').select();try{document.execCommand('copy')}catch(e){}};
$('#dload').onclick=()=>{try{S=Object.assign(fresh(),JSON.parse($('#dtx').value));save();$('#dlg').close();render()}catch(e){alert('Teksten kunne ikke læses som gemte data.')}};
render();
</script>
